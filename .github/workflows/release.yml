name: Release Chaos Hub

# Builds the real Chaos Hub (not the preview), signs it with Aunt13's permanent key,
# and puts a plain .apk on the Releases page so people can download it in one tap.
#
# Start it two ways:
#   - Actions > Release Chaos Hub > Run workflow
#   - or push a tag that starts with "v" (like v1.0.1)
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Every release is stamped with that same key, so updates install right over the old app.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseG1GC"

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the signing secrets are set
        shell: bash
        env:
          A: ${{ secrets.KEYSTORE_BASE64 }}
          B: ${{ secrets.KEYSTORE_PASSWORD }}
          C: ${{ secrets.KEY_ALIAS }}
          D: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$A" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$B" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$C" ] && missing="$missing KEY_ALIAS"
          [ -z "$D" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Pick the version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            name="${REF_NAME#v}"
            tag="$REF_NAME"
          else
            # The version name comes from the VERSION file at the top of the repo.
            # Bump that one line (1.0.0 -> 1.1.0) when you ship something new.
            name=$(tr -d ' \r\n' < VERSION)
            tag="v$name"
            # Already released this version? Re-runs become 1.0.0.1, 1.0.0.2... so the
            # Releases page never overwrites an APK people already downloaded.
            if gh release view "$tag" >/dev/null 2>&1; then
              name="$name.$RUN"
              tag="v$name"
            fi
          fi
          # versionCode must always go up, so it comes from the run counter.
          echo "code=$((100 + RUN))" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Unpack the signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -o pipefail
          # On failure, repeat the build's complaints as annotations on the run's summary page.
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" 2>&1 | tee build.log || {
            grep -E '^e: |error:|What went wrong|^> |Keystore|keystore|password|alias|Caused by|FAILED' build.log | head -40 |
              while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Throw away the unpacked key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check the APK is signed
        shell: bash
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::APK not found"; exit 1; }
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${TOOLS}apksigner" verify --print-certs "$APK"
          cp "$APK" "Chaos-Hub-$VERSION_NAME.apk"

      - name: Publish to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          notes="Tap **Chaos-Hub-$VERSION_NAME.apk** below to download, then open it to install.
          New here? The README has the step-by-step install guide."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Chaos-Hub-$VERSION_NAME.apk" --clobber
          else
            gh release create "$TAG" "Chaos-Hub-$VERSION_NAME.apk" \
              --title "Chaos Hub $VERSION_NAME" --notes "$notes" --latest \
              --target "$GITHUB_SHA"
          fi
